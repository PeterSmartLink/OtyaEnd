name: One-shot deleted-branch recovery index

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deleted branch tips from preserved GitHub history
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: PeterSmartLink
          CLEANUP_JOB_ID: '101840308616'
        shell: bash
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences "repos/$REPO/actions/jobs/$CLEANUP_JOB_ID/logs" > cleanup.log
          sed -n 's/^.*Deleting //p' cleanup.log | sed 's/\r$//' > branches.txt
          resolved=0
          unresolved=0
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            sha="$(gh api -X GET "repos/$REPO/actions/runs" -f branch="$branch" -f per_page=1 --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)"
            if [ -z "$sha" ]; then
              sha="$(gh api -X GET "repos/$REPO/pulls" -f state=all -f head="$OWNER:$branch" -f per_page=1 --jq '.[0].head.sha // empty' 2>/dev/null || true)"
            fi
            if [ -n "$sha" ] && gh api "repos/$REPO/commits/$sha" >/dev/null 2>&1; then
              echo "RESOLVED|$branch|$sha"
              resolved=$((resolved+1))
            else
              echo "UNRECOVERED|$branch"
              unresolved=$((unresolved+1))
            fi
          done < branches.txt
          echo "SUMMARY|resolved=$resolved|unresolved=$unresolved"
