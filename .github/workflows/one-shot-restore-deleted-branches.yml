name: One-shot deleted-branch audit

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Classify every deleted server branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: PeterSmartLink
          CLEANUP_JOB_ID: '101840308616'
        shell: bash
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences "repos/$REPO/actions/jobs/$CLEANUP_JOB_ID/logs" > cleanup.log
          sed -n 's/^.*Deleting //p' cleanup.log | sed 's/\r$//' > branches.txt

          fallback_sha() {
            case "$1" in
              audit/hash-refresh-token-indexes-20260904) echo bb624f6367153602f6ba43d333776cc4cefec156 ;;
              audit/hash-refresh-token-keys-20260904) echo 238961d5345eddd9493251a24fc0d5355e972688 ;;
              feat/space-console-shell-2026-09-02) echo a2bc340c4def880a98a1380699531b37248a5b42 ;;
              fix/actionable-crash-alerts-20260904) echo 7e0e5390f3f72fe6b21bbdafd8cc718bd9586f10 ;;
              fix/auth-otp-delivery-2026-09-01) echo 1b9206766eb863bef37d1c603d7b221a8816f692 ;;
              fix/canonical-public-config-links) echo 4030684b80db8fdd0d8a4a57e66cd0e27763c773 ;;
              fix/final-otya-hardening-20260907) echo 6c42d37b4efe47b6b65abf50ef9b7bee11485bc8 ;;
              fix/google-web-client-audience-20260901) echo 1af22126e4addc9b1a1a95810b803be06e0998af ;;
              fix/p0-release-approval-guard-20260901) echo f8d783ee5dd0edf28cd269c08526ce2b9e53f25d ;;
              fix/platform-safety-p0-20260901) echo ffc814b5a13d695cc6be7139bc28663ac77a1b7d ;;
              fix/server-public-brand-copy-20260901) echo e8a471309331f745e9b30a6e9a7e71abcc1a3c64 ;;
              modernize/next-streaming-20260901) echo 9d9c3fc9fc0b0bc47ca308849d91354d6612cc91 ;;
              release/v1.0.0-server-hardening-2026-09-02) echo 88404cb8a4ca341e4ba041d92385c84cc560dc65 ;;
              *) return 1 ;;
            esac
          }

          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]] || continue

            sha="$(gh api -X GET "repos/$REPO/actions/runs" -f branch="$branch" -f per_page=1 --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)"
            if [ -z "$sha" ]; then
              sha="$(gh api -X GET "repos/$REPO/pulls" -f state=all -f head="$OWNER:$branch" -f per_page=1 --jq '.[0].head.sha // empty' 2>/dev/null || true)"
            fi
            if [ -z "$sha" ]; then
              sha="$(fallback_sha "$branch" 2>/dev/null || true)"
            fi

            if [ -z "$sha" ] || ! gh api "repos/$REPO/commits/$sha" >/dev/null 2>&1; then
              echo "AUDIT|$branch|UNRESOLVED"
              continue
            fi

            gh api "repos/$REPO/compare/main...$sha" |
              jq -r --arg branch "$branch" --arg sha "$sha" '
                "AUDIT|" + $branch +
                "|sha=" + $sha +
                "|status=" + .status +
                "|ahead=" + (.ahead_by|tostring) +
                "|behind=" + (.behind_by|tostring) +
                "|files=" + ([.files[].filename] | join(","))'
          done < branches.txt
