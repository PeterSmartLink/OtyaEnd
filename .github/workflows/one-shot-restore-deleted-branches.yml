name: One-shot restore deleted branches

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Recover deleted branch tips from preserved GitHub history
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: PeterSmartLink
          CLEANUP_JOB_ID: '101840308616'
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/jobs/$CLEANUP_JOB_ID/logs" > cleanup.log
          sed -n 's/^.*Deleting //p' cleanup.log > branches.txt
          restored=0
          unresolved=0
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            if gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
              echo "EXISTS|$branch"
              continue
            fi

            sha="$(gh api -X GET "repos/$REPO/actions/runs" -f branch="$branch" -f per_page=1 --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)"
            if [ -z "$sha" ]; then
              sha="$(gh api -X GET "repos/$REPO/pulls" -f state=all -f head="$OWNER:$branch" -f per_page=1 --jq '.[0].head.sha // empty' 2>/dev/null || true)"
            fi

            if [ -z "$sha" ]; then
              echo "UNRECOVERED|$branch"
              unresolved=$((unresolved+1))
              continue
            fi

            if gh api "repos/$REPO/commits/$sha" >/dev/null 2>&1; then
              gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$sha" >/dev/null
              echo "RESTORED|$branch|$sha"
              restored=$((restored+1))
            else
              echo "UNRECOVERED|$branch|$sha"
              unresolved=$((unresolved+1))
            fi
          done < branches.txt
          echo "SUMMARY|restored=$restored|unresolved=$unresolved"
