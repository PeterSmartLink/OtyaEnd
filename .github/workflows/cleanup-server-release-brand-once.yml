name: One-time server release and brand cleanup

on:
  push:
    branches:
      - chore/canonical-brand-cleanup-20260907

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v6
        with:
          ref: chore/canonical-brand-cleanup-20260907
          fetch-depth: 0

      - name: Align Admin release identity and visible Otya brand
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/admin/page.tsx')
          text = path.read_text()
          replacements = {
              "tag: `v${version.trim()}`, version: version.trim(), version_code: versionCode":
                  "tag: `v${version.trim()}+${versionCode}`, version: version.trim(), version_code: versionCode",
              "`Release ${version.trim()} metadata published.`":
                  "`Release ${version.trim()}+${versionCode} metadata published.`",
              'src="/android-chrome-192x192.png" alt="OTYA"':
                  'src="/otya-app-icon.webp" alt="Otya"',
              '>OTYA Admin</h1>': '>Otya Admin</h1>',
              'Loading OTYA Admin…': 'Loading Otya Admin…',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected Admin source fragment not found: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/cleanup-server-release-brand-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes were needed.'
            exit 0
          fi
          git commit -m 'fix: align Admin with immutable Otya release identity'
          git push origin HEAD:chore/canonical-brand-cleanup-20260907
