name: Otya Operations Readiness

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: otya-operations-readiness
  cancel-in-progress: true

jobs:
  readiness:
    name: Check production recovery and schema readiness
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install locked Core tooling
        run: npm ci --ignore-scripts

      - name: Validate repository migration discipline
        id: migration_layout
        continue-on-error: true
        run: npm run verify:migrations

      - name: Verify Core D1 has no unapplied migrations
        id: core_migrations
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 migrations list DB --remote | tee /tmp/core-migrations.txt
          if grep -Eq '[0-9]{4}_[A-Za-z0-9_-]+\.sql' /tmp/core-migrations.txt; then
            echo 'ERROR: Core D1 has unapplied repository migrations.'
            exit 1
          fi

      - name: Verify Auth D1 migration visibility
        id: auth_migrations
        continue-on-error: true
        working-directory: auth-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx wrangler d1 migrations list AUTH_DB --remote | tee /tmp/auth-migrations.txt
          # Auth still has a preserved-schema repair path. Report drift here but
          # do not auto-apply until that legacy repair path is fully retired.
          if grep -Eq '[0-9]{8}_[A-Za-z0-9_-]+\.sql' /tmp/auth-migrations.txt; then
            echo 'WARNING: Auth D1 has migration-ledger drift; inspect before changing the repair path.'
          fi

      - name: Verify D1 Time Travel is available for both production databases
        id: time_travel
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel info otya-store-db --json > /tmp/core-time-travel.json
          npx wrangler d1 time-travel info otya-auth-db --config auth-worker/wrangler.toml --json > /tmp/auth-time-travel.json
          test -s /tmp/core-time-travel.json
          test -s /tmp/auth-time-travel.json
          echo 'D1 Time Travel recovery points are available for Core and Auth.'

      - name: Write readiness summary
        if: always()
        env:
          MIGRATION_LAYOUT: ${{ steps.migration_layout.outcome }}
          CORE_MIGRATIONS: ${{ steps.core_migrations.outcome }}
          AUTH_MIGRATIONS: ${{ steps.auth_migrations.outcome }}
          TIME_TRAVEL: ${{ steps.time_travel.outcome }}
        run: |
          {
            echo '## Otya production operations readiness'
            echo
            echo "- Repository migration layout: ${MIGRATION_LAYOUT}."
            echo "- Core production migration drift check: ${CORE_MIGRATIONS}."
            echo "- Auth migration visibility check: ${AUTH_MIGRATIONS}."
            echo "- D1 Time Travel availability check: ${TIME_TRAVEL}."
            echo '- This workflow is diagnostic only: it never applies migrations or restores a database.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce readiness gate
        if: always()
        env:
          MIGRATION_LAYOUT: ${{ steps.migration_layout.outcome }}
          CORE_MIGRATIONS: ${{ steps.core_migrations.outcome }}
          AUTH_MIGRATIONS: ${{ steps.auth_migrations.outcome }}
          TIME_TRAVEL: ${{ steps.time_travel.outcome }}
        run: |
          set -euo pipefail
          for result in "$MIGRATION_LAYOUT" "$CORE_MIGRATIONS" "$AUTH_MIGRATIONS" "$TIME_TRAVEL"; do
            if [ "$result" != 'success' ]; then
              echo 'ERROR: Otya production operations readiness is not green. Review the failed diagnostic above.'
              exit 1
            fi
          done
          echo 'Otya production operations readiness is green.'
