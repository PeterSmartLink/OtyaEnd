name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  baseline-security:
    name: Otya security baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Block tracked secret/signing files
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files)"
          if printf '%s\n' "$tracked" | grep -E '(^|/)(\.env($|\.)|\.dev\.vars$|key\.properties$|keystore\.jks$|.*\.(jks|keystore|p12|pfx|pem|key)$|.*firebase-adminsdk.*\.json$|service-account.*\.json$)' | grep -Ev '(^|/)\.env\.example$'; then
            echo '::error::Potential secret/signing material is tracked.'
            exit 1
          fi
      - name: Block private keys and provider tokens
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E -- '^-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----$'; then
            echo '::error::Private key material is committed.'
            exit 1
          fi
          if git grep -n -I -E -- '"type"[[:space:]]*:[[:space:]]*"service_account"'; then
            echo '::error::A Google/Firebase service-account document is committed.'
            exit 1
          fi
          if git grep -n -I -E -- '"private_key"[[:space:]]*:[[:space:]]*"-----BEGIN'; then
            echo '::error::Embedded JSON private-key material is committed.'
            exit 1
          fi
          if git grep -n -I -E -- '[0-9]{8,12}:[A-Za-z0-9_-]{25,}'; then
            echo '::error::Possible Telegram bot token committed to source.'
            exit 1
          fi
          if git grep -n -I -E -- '\bre_[A-Za-z0-9_-]{20,}\b'; then
            echo '::error::Possible Resend API key committed to source.'
            exit 1
          fi
          if git grep -n -I -E -- '\b(ghp|github_pat)_[A-Za-z0-9_]{20,}\b'; then
            echo '::error::Possible GitHub access token committed to source.'
            exit 1
          fi
          if git grep -n -I -E -- '\bsk-[A-Za-z0-9_-]{20,}\b'; then
            echo '::error::Possible AI/provider secret key committed to source.'
            exit 1
          fi
      - uses: actions/setup-node@v7
        with: { node-version: '22', package-manager-cache: false }
      - name: Validate and audit web/backend
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node scripts/npm-audit-retry.mjs --audit-level=high
          npm run check
      - name: Validate and audit auth worker
        working-directory: auth-worker
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node ../scripts/npm-audit-retry.mjs --audit-level=high
          npm test
          npx tsc --noEmit
      - name: Validate and audit Next worker
        working-directory: ai-worker
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node ../scripts/npm-audit-retry.mjs --audit-level=high
          npm test
          npm run check

  dependency-review:
    name: Dependency review (GHAS)
    if: github.event_name == 'pull_request' && vars.GHAS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with: { fail-on-severity: high }

  codeql:
    name: CodeQL JavaScript/TypeScript (GHAS)
    if: github.event_name != 'pull_request' && vars.GHAS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with: { languages: javascript-typescript }
      - uses: actions/setup-node@v7
        with: { node-version: '22', package-manager-cache: false }
      - run: npm ci --ignore-scripts
      - working-directory: auth-worker
        run: npm ci --ignore-scripts
      - working-directory: ai-worker
        run: npm ci --ignore-scripts
      - run: npm run build
      - uses: github/codeql-action/analyze@v4
