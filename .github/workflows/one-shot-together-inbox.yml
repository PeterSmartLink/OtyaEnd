name: One-shot Together invite inbox

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-together-inbox.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add authenticated in-app Together invites
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          source = Path('src/together-control.mjs')
          text = source.read_text()

          if "const INVITE_PREFIX" not in text:
              text = text.replace(
                  "const SIGNAL_PREFIX = 'together:signal:'\n",
                  "const SIGNAL_PREFIX = 'together:signal:'\nconst INVITE_PREFIX = 'together:invite:'\n",
                  1,
              )

          if "async function getPendingInvites" not in text:
              helper = """

          function inviteKey(username, roomId) {
            return `${INVITE_PREFIX}${String(username || '').trim().toLowerCase()}:${roomId}`
          }

          function invitePrefix(username) {
            return `${INVITE_PREFIX}${String(username || '').trim().toLowerCase()}:`
          }

          async function getPendingInvites(request, env) {
            const identity = await currentPublicIdentity(request, env)
            if (!identity) {
              return json({
                error: 'Choose an Otya username before joining Anywhere Together.',
                code: 'USERNAME_REQUIRED',
              }, 409)
            }

            const prefix = invitePrefix(identity.username)
            const listed = await env.KV.list({ prefix, limit: 50 })
            const invites = []

            for (const item of listed.keys || []) {
              const roomId = item.name.slice(prefix.length)
              const room = await readRoom(env, roomId)
              if (!room || room.status === 'closed' || room.guest?.username !== identity.username) {
                if (typeof env.KV.delete === 'function') await env.KV.delete(item.name)
                continue
              }
              invites.push(publicRoom(room))
            }

            invites.sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')))
            return json({ ok: true, invites })
          }
          """
              match = re.search(r"async function writeRoom\(env, room\) \{.*?\n\}", text, flags=re.S)
              if not match:
                  raise SystemExit('writeRoom anchor changed')
              text = text[:match.end()] + helper + text[match.end():]

          if "inviteKey(guest.username, room.id)" not in text:
              text, count = re.subn(
                  r"(  await writeRoom\(env, room\)\n)(  return json\(\{\n    ok: true,\n    room: publicRoom\(room\),\n    invite_token: inviteToken,)",
                  r"\1  await env.KV.put(inviteKey(guest.username, room.id), JSON.stringify({\n    room_id: room.id,\n    created_at: room.createdAt,\n  }), { expirationTtl: ROOM_TTL_SECONDS })\n\2",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('createRoom return anchor changed')

          if "INVITE_NOT_PENDING" not in text:
              text, count = re.subn(
                  r"  const body = await request\.json\(\)\.catch\(\(\) => null\)\n  const inviteToken = typeof body\?\.invite_token === 'string' \? body\.invite_token : ''\n  if \(!inviteToken \|\| await sha256\(inviteToken\) !== room\.inviteTokenHash\) \{\n    return json\(\{ error: 'Invalid or expired Together invite\.', code: 'INVALID_INVITE' \}, 403\)\n  \}",
                  """  const body = await request.json().catch(() => null)
          const inviteToken = typeof body?.invite_token === 'string' ? body.invite_token : ''
          if (inviteToken) {
            if (await sha256(inviteToken) !== room.inviteTokenHash) {
              return json({ error: 'Invalid or expired Together invite.', code: 'INVALID_INVITE' }, 403)
            }
          } else {
            const pending = await env.KV.get(inviteKey(identity.username, room.id))
            if (!pending) {
              return json({ error: 'This Together invite is no longer pending.', code: 'INVITE_NOT_PENDING' }, 403)
            }
          }""",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('join token anchor changed')

          if "delete(inviteKey(identity.username, room.id))" not in text:
              text, count = re.subn(
                  r"(  room\.guestUserId = user\.id\n  room\.status = 'connected'\n  room\.guest = identity\n  await writeRoom\(env, room\)\n)",
                  r"\1  if (typeof env.KV.delete === 'function') await env.KV.delete(inviteKey(identity.username, room.id))\n",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('join write anchor changed')

          if "inviteKey(room.guest.username, room.id)" not in text:
              text, count = re.subn(
                  r"(  room\.status = 'closed'\n  await writeRoom\(env, room\)\n)(  return json\(\{ ok: true \}\)\n\})",
                  r"\1  if (room.guest?.username && typeof env.KV.delete === 'function') {\n    await env.KV.delete(inviteKey(room.guest.username, room.id))\n  }\n\2",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('close room anchor changed')

          if "url.pathname === '/api/together/invites'" not in text:
              needle = "  if (url.pathname === '/api/together/rooms' && request.method === 'POST') {"
              if needle not in text:
                  raise SystemExit('router anchor changed')
              text = text.replace(
                  needle,
                  "  if (url.pathname === '/api/together/invites' && request.method === 'GET') {\n"
                  "    return getPendingInvites(request, env)\n"
                  "  }\n\n"
                  + needle,
                  1,
              )

          source.write_text(text)

          tests = Path('test/together-control.test.mjs')
          test_text = tests.read_text()
          if "async delete(key)" not in test_text:
              test_text = test_text.replace(
                  "  async put(key, value) { this.values.set(key, value) }\n",
                  "  async put(key, value) { this.values.set(key, value) }\n\n  async delete(key) { this.values.delete(key) }\n",
                  1,
              )

          if "invited friend discovers and joins the room inside OTYA without a link" not in test_text:
              marker = "test('signaling is short-lived recipient-specific setup data only', async () => {"
              if marker not in test_text:
                  raise SystemExit('test insertion anchor changed')
              new_test = """test('invited friend discovers and joins the room inside OTYA without a link', async () => {
            const env = { KV: new MemoryKv(), AUTH: authBinding() }
            const created = await createRoom(env)

            const pending = await handleTogetherControl(
              request('/api/together/invites', { token: 'guest' }),
              env,
              { id: 'guest-private' },
            )
            assert.equal(pending.status, 200)
            const pendingBody = await pending.json()
            assert.equal(pendingBody.invites.length, 1)
            assert.equal(pendingBody.invites[0].room_id, created.room.room_id)
            assert.equal(pendingBody.invites[0].host.username, 'peter')

            const strangerPending = await handleTogetherControl(
              request('/api/together/invites', { token: 'stranger' }),
              env,
              { id: 'stranger-private' },
            )
            assert.equal((await strangerPending.json()).invites.length, 0)

            const joined = await handleTogetherControl(
              request(`/api/together/rooms/${created.room.room_id}/join`, {
                method: 'POST',
                token: 'guest',
                body: {},
              }),
              env,
              { id: 'guest-private' },
            )
            assert.equal(joined.status, 200)
            assert.equal((await joined.json()).room.guest.connected, true)

            const afterJoin = await handleTogetherControl(
              request('/api/together/invites', { token: 'guest' }),
              env,
              { id: 'guest-private' },
            )
            assert.equal((await afterJoin.json()).invites.length, 0)
          })

          """
              test_text = test_text.replace(marker, new_test + marker, 1)

          tests.write_text(test_text)
          PY

          git config user.name 'PeterSmart Link'
          git config user.email 'petersmartlink@gmail.com'
          git add src/together-control.mjs test/together-control.test.mjs
          git commit -m 'feat(together): add authenticated in-app invite inbox'
          git push origin HEAD:main
