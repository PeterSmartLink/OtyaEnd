name: OTYA Telegram Provider Smoke

on:
  workflow_run:
    workflows: ['Deploy OTYA to Cloudflare']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: otya-telegram-provider-smoke-production
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Require Telegram Sign-In human security gate
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          status="$(curl -sS --max-time 20 -o "$response" -w '%{http_code}' -X POST -H 'Accept: application/json' 'https://petersmartlink.com/api/auth/telegram/start?mode=login')"
          cat "$response"
          echo
          echo "HTTP $status"

          # CI is intentionally not given a Turnstile bypass. Production must
          # reject this automated login-start request and require the real
          # human challenge before Telegram authorization can begin.
          test "$status" = "400"
          grep -q 'TURNSTILE_REQUIRED' "$response"

      - name: Check Telegram handoff page
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' 'https://petersmartlink.com/telegram-login/?telegram_smoke=1')"
          test "$status" = "200"

      - name: Check live Otya bot webhook and Next readiness after production deploy
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          for attempt in $(seq 1 30); do
            status="$(curl -sS --max-time 20 -o "$response" -w '%{http_code}' 'https://petersmartlink.com/api/telegram/status' || true)"
            if [ "$status" = "200" ] \
              && grep -q '"webhook_configured":true' "$response" \
              && grep -q '"ai_service_bound":true' "$response" \
              && grep -q '"ai_service_ready":true' "$response"; then
              cat "$response"
              echo
              echo 'OTYA Telegram bot runtime and Next dependency are healthy.'
              exit 0
            fi
            echo "Telegram runtime not healthy yet (attempt $attempt, HTTP ${status:-network-error})."
            sleep 10
          done
          cat "$response" || true
          echo '::error::OTYA Telegram bot webhook or live Next dependency is not healthy.'
          exit 1
