[project]
name = "otya-python-foundation"
version = "0.1.0"
description = "Isolated Python-first foundation proof for the Otya ecosystem"
requires-python = ">=3.13"
dependencies = [
  "fastapi",
]

[dependency-groups]
dev = [
  "workers-py",
  "workers-runtime-sdk",
  "pytest",
  "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
